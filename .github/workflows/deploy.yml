name: Deploy Marmalade to Azure App Service

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend
        env:
          VITE_STREAM_API_KEY: ${{ secrets.VITE_STREAM_API_KEY }}

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Move frontend build to backend
        run: |
          rm -rf backend/frontend
          mkdir -p backend/frontend/dist
          cp -r frontend/dist/* backend/frontend/dist/

      - name: Prepare deployment package
        run: |
          cd backend
          zip -r ../marmalade.zip .

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'marmalade' # must match your Azure App Service name
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: 'marmalade.zip'
