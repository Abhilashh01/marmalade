name: Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_LOCATION: centralindia
  RESOURCE_GROUP: rg-marmalade-prod
  ENVIRONMENT_NAME: prod
  FRONTEND_IMAGE_NAME: marmalade-frontend
  BACKEND_IMAGE_NAME: marmalade-backend

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Lint frontend
        run: npm run lint --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend
        env:
          VITE_STREAM_API_KEY: ${{ secrets.VITE_STREAM_API_KEY }}

      - name: Install backend dependencies
        run: npm ci --prefix backend

  cd:
    runs-on: ubuntu-latest
    needs: ci
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group
        run: az group create --name "$RESOURCE_GROUP" --location "$AZURE_LOCATION"

      - name: Provision registry
        id: registry
        run: |
          outputs=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/registry.bicep \
            --parameters environmentName="$ENVIRONMENT_NAME" \
            --parameters location="$AZURE_LOCATION" \
            --query properties.outputs \
            --output json)
          echo "acrName=$(echo "$outputs" | jq -r '.acrName.value')" >> "$GITHUB_OUTPUT"
          echo "acrLoginServer=$(echo "$outputs" | jq -r '.acrLoginServer.value')" >> "$GITHUB_OUTPUT"

      - name: Login to Azure Container Registry
        run: az acr login --name "${{ steps.registry.outputs.acrName }}"

      - name: Build and push backend image
        run: |
          docker build \
            --tag "${{ steps.registry.outputs.acrLoginServer }}/${BACKEND_IMAGE_NAME}:${{ github.sha }}" \
            --tag "${{ steps.registry.outputs.acrLoginServer }}/${BACKEND_IMAGE_NAME}:latest" \
            ./backend
          docker push "${{ steps.registry.outputs.acrLoginServer }}/${BACKEND_IMAGE_NAME}:${{ github.sha }}"
          docker push "${{ steps.registry.outputs.acrLoginServer }}/${BACKEND_IMAGE_NAME}:latest"

      - name: Build and push frontend image
        run: |
          docker build \
            --build-arg VITE_STREAM_API_KEY="${{ secrets.VITE_STREAM_API_KEY }}" \
            --tag "${{ steps.registry.outputs.acrLoginServer }}/${FRONTEND_IMAGE_NAME}:${{ github.sha }}" \
            --tag "${{ steps.registry.outputs.acrLoginServer }}/${FRONTEND_IMAGE_NAME}:latest" \
            ./frontend
          docker push "${{ steps.registry.outputs.acrLoginServer }}/${FRONTEND_IMAGE_NAME}:${{ github.sha }}"
          docker push "${{ steps.registry.outputs.acrLoginServer }}/${FRONTEND_IMAGE_NAME}:latest"

      - name: Provision Container Apps
        id: apps
        run: |
          outputs=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters environmentName="$ENVIRONMENT_NAME" \
            --parameters location="$AZURE_LOCATION" \
            --parameters acrName="${{ steps.registry.outputs.acrName }}" \
            --parameters backendImage="${{ steps.registry.outputs.acrLoginServer }}/${BACKEND_IMAGE_NAME}:${{ github.sha }}" \
            --parameters frontendImage="${{ steps.registry.outputs.acrLoginServer }}/${FRONTEND_IMAGE_NAME}:${{ github.sha }}" \
            --parameters mongoUri="${{ secrets.MONGO_URI }}" \
            --parameters jwtSecretKey="${{ secrets.JWT_SECRET_KEY }}" \
            --parameters streamApiKey="${{ secrets.STREAM_API_KEY }}" \
            --parameters streamApiSecret="${{ secrets.STREAM_API_SECRET }}" \
            --query properties.outputs \
            --output json)
          echo "frontendFqdn=$(echo "$outputs" | jq -r '.frontendFqdn.value')" >> "$GITHUB_OUTPUT"

      - name: Deployment URL
        run: echo "https://${{ steps.apps.outputs.frontendFqdn }}"
