services:
  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: 5001
      CLIENT_ORIGIN: http://localhost:8080
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      STREAM_API_KEY: ${STREAM_API_KEY}
      STREAM_API_SECRET: ${STREAM_API_SECRET}
    expose:
      - "5001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5001/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_STREAM_API_KEY: ${VITE_STREAM_API_KEY}
    environment:
      BACKEND_URL: http://backend:5001
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
